apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ghostfolio
resources:
  - ../../base/ghostfolio
  # Created (already SOPS-encrypted) by scripts/ghostfolio-secret.sh.
  # Run it BEFORE committing: if this file is missing, the whole `apps`
  # Kustomization fails and Linkding/Audiobookshelf stop reconciling too.
  - ghostfolio-env-secret.yaml
  - ingress.yaml
