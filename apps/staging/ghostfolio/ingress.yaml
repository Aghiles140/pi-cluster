# Private HTTPS access through the Tailscale operator:
#   https://ghostfolio.<your-tailnet>.ts.net
# Reachable only from devices logged into your tailnet. No port is opened on
# the router and nothing appears in public DNS. The certificate is issued and
# renewed by Tailscale (MagicDNS + HTTPS must be enabled on the tailnet).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghostfolio
  namespace: ghostfolio
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: ghostfolio
      port:
        number: 3333
  tls:
    - hosts:
        - ghostfolio
